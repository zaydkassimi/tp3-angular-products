<div class="container mt-3">
  <div class="card">
    <div class="card-header">List of Products</div>
    <div class="card-body">
      <form [formGroup]="searchFormGroup" (ngSubmit)="handleSearch()">
        <div class="input-group">
          <label class="input-group-text">Keyword:</label>
          <input type="text" formControlName="keyword" class="form-control">
          <button class="btn btn-info">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>
      @if (errorMessage) {
        <div class="text-danger">{{ errorMessage }}</div>
      }
      <table class="table">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Price</th><th>Quantity</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (p of products; track p.id) {
            <tr>
              <td>{{ p.id }}</td>
              <td>{{ p.name }}</td>
              <td>{{ p.price }}</td>
              <td>{{ p.quantity }}</td>
              <td>
                <button (click)="handleEditProduct(p)" class="btn btn-success">
                  <i class="bi bi-pencil"></i>
                </button>
                <button (click)="handleDeleteProduct(p)" class="btn btn-danger ms-1">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5">No products found</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
